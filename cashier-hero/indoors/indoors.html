<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shelves + Stovetop + Mug Hooks (Physics)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    .hud {
      position: fixed; left: 12px; top: 12px; color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: 14px; opacity: 0.9; line-height: 1.3;
    }
    canvas { display: block; margin: 0 auto; background: #1b1b1b; }
  </style>
</head>
<body>
  <div class="hud">
    Drag items with mouse. Try hanging mugs on the top pegs.<br/>
    Layout: 2 shelves left, 2 shelves right, stovetop bottom-center, hooks top.
  </div>

  <canvas id="c" width="960" height="600"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script>
    // ----- Matter.js aliases -----
    var Engine = Matter.Engine;
    var World = Matter.World;
    var Bodies = Matter.Bodies;
    var Body = Matter.Body;
    var Composite = Matter.Composite;
    var Mouse = Matter.Mouse;
    var MouseConstraint = Matter.MouseConstraint;
    var Runner = Matter.Runner;

    // ----- Canvas -----
    var canvas = document.getElementById("c");
    var ctx = canvas.getContext("2d");

    // ----- Engine -----
    var engine = Engine.create();
    engine.gravity.y = 1.05;

    // ----- Constants -----
    var W = canvas.width;
    var H = canvas.height;

    function moneyNope() {} // intentionally empty; placeholder if you later add pricing ;)

    // ----- Static boundaries -----
    var floor = Bodies.rectangle(W/2, H + 20, W + 200, 60, { isStatic: true, label: "floor" });
    var leftWall = Bodies.rectangle(-20, H/2, 60, H + 200, { isStatic: true, label: "leftWall" });
    var rightWall = Bodies.rectangle(W + 20, H/2, 60, H + 200, { isStatic: true, label: "rightWall" });

    // ----- Scene props (your requested layout) -----
    // Two short shelves on each side
    // (thin rectangles with a little friction so items settle)
    function shelf(x, y, width) {
      return Bodies.rectangle(x, y, width, 16, {
        isStatic: true,
        label: "shelf",
        friction: 0.9
      });
    }

    var shelfLeftTop = shelf(170, 220, 260);
    var shelfLeftBot = shelf(170, 360, 260);

    var shelfRightTop = shelf(W - 170, 220, 260);
    var shelfRightBot = shelf(W - 170, 360, 260);

    // Stovetop in the middle, bottom
    // Make it chunkier so it reads like a counter/stove block
    var stovetop = Bodies.rectangle(W/2, H - 120, 320, 28, {
      isStatic: true,
      label: "stovetop",
      friction: 0.95
    });

    // Optional: stove base so it looks grounded
    var stoveBase = Bodies.rectangle(W/2, H - 70, 360, 80, {
      isStatic: true,
      label: "stoveBase",
      friction: 0.95
    });

    // Row of hooks across the top:
    // We’ll do small static circles (pegs). You can hang a mug handle on them.
    function hookPeg(x, y) {
      return Bodies.circle(x, y, 8, { isStatic: true, label: "hookPeg" });
    }

    var hooks = [];
    var hookCount = 10;
    var margin = 90;
    for (var i = 0; i < hookCount; i += 1) {
      var t = i / (hookCount - 1);
      var x = margin + t * (W - margin * 2);
      hooks.push(hookPeg(x, 70));
    }

    // A slim bar behind pegs so it reads as a “rack”
    var hookRack = Bodies.rectangle(W/2, 55, W - 180, 10, { isStatic: true, label: "hookRack" });

    // ----- Items -----
    // Mug as a compound body: a round-ish body + a small handle ring.
    // The handle ring colliding with pegs creates a “hang” behavior that feels good.
    function makeMug(x, y, labelText) {
      var cup = Bodies.circle(x, y, 22, {
        restitution: 0.05,
        friction: 0.9,
        density: 0.003,
        label: "mugCup"
      });

      // Handle: a small circle offset to the right (like a ring/handle)
      var handle = Bodies.circle(x + 26, y - 6, 10, {
        restitution: 0.05,
        friction: 0.9,
        density: 0.001,
        label: "mugHandle"
      });

      var mug = Body.create({
        parts: [cup, handle],
        restitution: 0.05,
        friction: 0.9,
        label: "mug"
      });

      mug.renderInfo = { kind: "mug", text: labelText || "Mug" };
      return mug;
    }

    function makeBox(x, y, w, h, text) {
      var b = Bodies.rectangle(x, y, w, h, {
        restitution: 0.05,
        friction: 0.8,
        density: 0.002,
        label: "item"
      });
      b.renderInfo = { kind: "box", w: w, h: h, text: text || "Item" };
      return b;
    }

    // Place a couple mugs near the stovetop and a couple items on shelves
    var items = [
      makeMug(W/2 - 60, H - 220, "Mug A"),
      makeMug(W/2 + 20, H - 220, "Mug B"),
      makeBox(140, 180, 52, 36, "Tea"),
      makeBox(W - 140, 180, 64, 28, "Syrup")
    ];

    // ----- Add to world -----
    World.add(engine.world, [
      floor, leftWall, rightWall,
      shelfLeftTop, shelfLeftBot, shelfRightTop, shelfRightBot,
      hookRack
    ].concat(hooks).concat([stovetop, stoveBase]).concat(items));

    // ----- Mouse drag -----
    var mouse = Mouse.create(canvas);
    var mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: { stiffness: 0.2, render: { visible: false } }
    });
    World.add(engine.world, mouseConstraint);

    // ----- Physics runner -----
    var runner = Runner.create();
    Runner.run(runner, engine);

    // ----- Rendering helpers -----
    function drawStaticRect(body, fill, stroke) {
      var verts = body.vertices;
      ctx.save();
      ctx.translate(body.position.x, body.position.y);
      ctx.rotate(body.angle);
      ctx.beginPath();
      ctx.moveTo(verts[0].x - body.position.x, verts[0].y - body.position.y);
      for (var i = 1; i < verts.length; i += 1) {
        ctx.lineTo(verts[i].x - body.position.x, verts[i].y - body.position.y);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawCircle(body, radius, fill, stroke) {
      ctx.save();
      ctx.translate(body.position.x, body.position.y);
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawText(x, y, text, color) {
      ctx.save();
      ctx.fillStyle = color || "#fff";
      ctx.font = "12px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawMug(mugBody) {
      // mugBody is compound; parts[0] is the parent hull, parts[1..] are actual shapes
      // We drew it as cup + handle circles, so we can draw the circles by looking at parts.
      // parts[1] => cup circle body, parts[2] => handle circle body (order tends to be: parent + children)
      var parts = mugBody.parts;
      // Find circles by radius heuristics (Matter doesn't expose radius on arbitrary body unless it's circle).
      // For circles created with Bodies.circle, .circleRadius is set.
      for (var i = 1; i < parts.length; i += 1) {
        var p = parts[i];
        var r = p.circleRadius || 0;
        if (r > 0) {
          var fill = (r >= 18) ? "#e6e6e6" : "#cfcfcf";
          var stroke = "#aaaaaa";
          drawCircle(p, r, fill, stroke);
        }
      }
      drawText(mugBody.position.x, mugBody.position.y, mugBody.renderInfo.text, "#111");
    }

    function drawBox(itemBody) {
      ctx.save();
      ctx.translate(itemBody.position.x, itemBody.position.y);
      ctx.rotate(itemBody.angle);
      ctx.fillStyle = "#e6e6e6";
      ctx.strokeStyle = "#aaaaaa";
      ctx.fillRect(-itemBody.renderInfo.w/2, -itemBody.renderInfo.h/2, itemBody.renderInfo.w, itemBody.renderInfo.h);
      ctx.strokeRect(-itemBody.renderInfo.w/2, -itemBody.renderInfo.h/2, itemBody.renderInfo.w, itemBody.renderInfo.h);
      ctx.restore();
      drawText(itemBody.position.x, itemBody.position.y, itemBody.renderInfo.text, "#111");
    }

    function drawLabels() {
      // shelf labels
      drawText(170, 195, "Shelf", "#bbb");
      drawText(170, 335, "Shelf", "#bbb");
      drawText(W - 170, 195, "Shelf", "#bbb");
      drawText(W - 170, 335, "Shelf", "#bbb");
      drawText(W/2, H - 150, "Stovetop", "#bbb");
      drawText(W/2, 30, "Mug Hooks", "#bbb");
    }

    function loop() {
      ctx.clearRect(0, 0, W, H);

      // Background accent zones (optional, helps readability)
      ctx.save();
      ctx.fillStyle = "#151515";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      // Draw static props
      drawStaticRect(shelfLeftTop, "#3a3a3a", "#585858");
      drawStaticRect(shelfLeftBot, "#3a3a3a", "#585858");
      drawStaticRect(shelfRightTop, "#3a3a3a", "#585858");
      drawStaticRect(shelfRightBot, "#3a3a3a", "#585858");

      drawStaticRect(hookRack, "#2f2f2f", "#4b4b4b");
      for (var i = 0; i < hooks.length; i += 1) drawCircle(hooks[i], 8, "#5a5a5a", "#7a7a7a");

      drawStaticRect(stovetop, "#444", "#666");
      drawStaticRect(stoveBase, "#2b2b2b", "#444");

      // Draw items
      for (var j = 0; j < items.length; j += 1) {
        if (items[j].renderInfo && items[j].renderInfo.kind === "mug") drawMug(items[j]);
        else if (items[j].renderInfo && items[j].renderInfo.kind === "box") drawBox(items[j]);
      }

      drawLabels();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
